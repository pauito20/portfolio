<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="PGL">
  <defs>
    <linearGradient id="lobeTop" x1="32" y1="8" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a5fb4"/>
      <stop offset="1" stop-color="#3f8fe0"/>
    </linearGradient>
    <linearGradient id="lobeBottom" x1="32" y1="34" x2="32" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#08386b"/>
      <stop offset="1" stop-color="#15539e"/>
    </linearGradient>
    <linearGradient id="lobeLeft" x1="4" y1="46" x2="26" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7ef0d6"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="lobeRight" x1="60" y1="18" x2="38" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3fe0e6"/>
      <stop offset="1" stop-color="#0078d4"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="#0a0e17"/>
  <rect x=".75" y=".75" width="62.5" height="62.5" rx="14.25" fill="none" stroke="#1f2733"/>

  <!-- Composición de cuatro lóbulos superpuestos en aspa, inspirada en la
       gama y disposición del logo real de BC (verde-azulado, cian, azul,
       marino) — dibujo propio, no el archivo de Microsoft. -->
  <g transform="translate(32,32)">
    <ellipse cx="-9" cy="-9" rx="12.5" ry="9" transform="rotate(-45 -9 -9)" fill="url(#lobeLeft)"/>
    <ellipse cx="9" cy="-9" rx="12.5" ry="9" transform="rotate(45 9 -9)" fill="url(#lobeRight)"/>
    <circle cx="0" cy="-12" r="10.5" fill="url(#lobeTop)"/>
    <circle cx="0" cy="12" r="11.5" fill="url(#lobeBottom)"/>
    <circle cx="0" cy="0" r="6.5" fill="#22d3ee" opacity=".85"/>
  </g>
</svg>
