name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Build
        # Project page -> /<repo>/ . Si el repo pasa a ser <usuario>.github.io o se usa CNAME, cambiar a '/'.
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build
      - name: Verify base path was applied
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: grep -q "src=\"${BASE_PATH}assets/" dist/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
